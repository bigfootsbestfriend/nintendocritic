<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nintendo Critic: coming soon</title>
<meta name="description" content="Switch 2 game checker: game-key cards, Switch 1 compatibility and upgrade paths. Coming soon.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #fffaf0; --ink: #1d1433; --muted: #5b5170; --accent: #4a23b5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #130d22; --ink: #f4efff; --muted: #b9add6; --accent: #ffb627; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; text-align: center; }
  main { max-width: 560px; }
  img { width: min(320px, 80vw); height: auto; }
  .dark { display: none; }
  @media (prefers-color-scheme: dark) { .light { display: none; } .dark { display: inline; } }
  h1 { font-size: 1.6rem; margin: 24px 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  a { color: var(--accent); }
  small { display: block; margin-top: 32px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <img class="light" src="/static/logo-light.png" alt="Nintendo Critic" width="620" height="254">
  <img class="dark" src="/static/logo-dark.png" alt="Nintendo Critic" width="620" height="254">
  <h1>The Switch 2 game checker is coming soon</h1>
  <p>Game-key card or full cartridge? Does your Switch 1 game work on Switch 2? Is the upgrade worth it? We'll answer it for every game.</p>
  <small>Nintendo Critic is an independent site and is not affiliated with or endorsed by Nintendo.</small>
</main>
</body>
</html>
